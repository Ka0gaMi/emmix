<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emmix Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0d1117;
      overflow: hidden;
      font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Toolbar ─────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 42px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
      gap: 10px;
      user-select: none;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #58a6ff;
    }
    .logo b { color: #3fb950; font-weight: 700; }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wasm-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #6e7681;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wasm-badge.loaded { color: #79c0ff; }
    .wasm-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #6e7681;
      flex-shrink: 0;
    }
    .wasm-badge.loaded .dot { background: #3fb950; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      line-height: 1.5;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: #2d333b; border-color: #6e7681; }

    .status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status-pill.loading  { color: #8b949e; border-color: #30363d; }
    .status-pill.ready    { color: #3fb950; border-color: #238636; background: rgba(35,134,54,.15); }
    .status-pill.running  { color: #d29922; border-color: #9e6a03; background: rgba(158,106,3,.15); }
    .status-pill.error    { color: #f85149; border-color: #da3633; background: rgba(218,54,51,.12); }

    /* ── Terminal container ───────────────────────────── */
    #terminal-wrap {
      flex: 1;
      overflow: auto;
      padding: 14px 16px;
      min-width: 0;
      min-height: 0;
      color: #c9d1d9;
      background: #0d1117;
      font-size: 14px;
      line-height: 1.55;
      cursor: text;
    }

    .terminal-output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .terminal-input-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .terminal-prompt {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .terminal-input {
      flex: 1 1 auto;
      min-width: 8ch;
      border: 0;
      outline: 0;
      padding: 0;
      color: #c9d1d9;
      background: transparent;
      font: inherit;
      line-height: inherit;
    }

    .terminal-input:disabled {
      opacity: .6;
    }

    .banner { color: #58a6ff; font-weight: 700; letter-spacing: .16em; }
    .title { color: #f0f6fc; font-weight: 700; }
    .muted { color: #8b949e; }
    .green, .success { color: #3fb950; }
    .blue { color: #58a6ff; }
    .warning { color: #d29922; }
    .error { color: #ff7b72; }
    .command-gap {
      display: inline-block;
      width: 28px;
    }

    /* ── Drop overlay ─────────────────────────────────── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(88,166,255,.1);
      border: 2px dashed #58a6ff;
      z-index: 50;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #58a6ff;
      letter-spacing: 0.05em;
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="logo">EM<b>MIX</b></div>
      <div class="toolbar-right">
        <div class="wasm-badge" id="wasm-badge">
          <span class="dot"></span>
          <span id="wasm-label">no module loaded</span>
        </div>
        <label class="btn" for="file-input">
          &#8593; Upload .wasm
          <input type="file" id="file-input" accept=".wasm" hidden />
        </label>
        <span class="status-pill loading" id="status">loading</span>
      </div>
    </header>
    <div id="terminal-wrap"></div>
  </div>

  <div id="drop-overlay">Drop .wasm to load</div>

  <!-- Absolute path: file lives at /web/terminal.js, served from emmix root -->
  <script type="module" src="/web/terminal.js"></script>
</body>
</html>
